# Public overlay: host ports only for the web UI and API gateway.
# Set PUBLIC_WEB_ORIGIN / VITE_PUBLIC_SITE_URL / VITE_API_BASE_URL / PUBLIC_API_BASE in docker/.env
# Usage: docker compose --env-file docker/.env -f docker-compose.yml -f docker-compose.public.yml up -d --build

services:
  postgres:
    ports: !override []
  redis:
    ports: !override []
  rabbitmq:
    ports: !override []
  identity-service:
    ports: !override []
  catalog-service:
    ports: !override []
  compound-service:
    ports: !override []
  order-service:
    ports: !override []
  payment-service:
    ports: !override []
  shipment-service:
    ports: !override []
  notification-service:
    ports: !override []
  gateway-service:
    ports: !override
      - "5000:8080"
  web-app:
    ports: !override
      - "3000:80"
