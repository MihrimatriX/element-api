# Public overlay: loopback-only web (:3000) + gateway (:5000); other ports closed.
# TLS is host Caddy (deploy/Caddyfile.elements-api.example) — see docs/PUBLIC-HOST.md.
# Set PUBLIC_WEB_ORIGIN / VITE_* / PUBLIC_API_BASE / JWT_SECRET / INTERNAL_API_KEY in docker/.env
# Usage: docker compose --env-file docker/.env -f docker-compose.yml -f docker-compose.public.yml up -d --build

services:
  postgres:
    ports: !override []
  redis:
    ports: !override []
  rabbitmq:
    ports: !override []
  identity-service:
    ports: !override []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      JwtSettings__Secret: ${JWT_SECRET:?Set a unique production JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set a unique production INTERNAL_API_KEY}
  catalog-service:
    ports: !override []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
  compound-service:
    ports: !override []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
  order-service:
    ports: !override []
    environment:
      NODE_ENV: production
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set a unique production INTERNAL_API_KEY}
  payment-service:
    ports: !override []
  shipment-service:
    ports: !override []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
  notification-service:
    ports: !override []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
  gateway-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set a unique production INTERNAL_API_KEY}
    ports: !override
      - "127.0.0.1:5000:8080"
  web-app:
    ports: !override
      - "127.0.0.1:3000:80"
