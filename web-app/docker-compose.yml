# Sadece web arayüzü (API için gateway host'ta: http://localhost:5000)
# docker compose up -d --build

name: web-app-stack

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:80"
