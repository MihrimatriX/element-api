server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;
    server_tokens off;

    # Direct host-port mode has no Caddy in front; Caddy passes an upstream Content-Encoding through as-is.
    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/xml application/javascript text/javascript application/json image/svg+xml;

    location = /health {
        default_type application/json;
        return 200 '{"status":"Healthy","service":"element-web-app"}';
    }

    location = /info {
        default_type application/json;
        return 200 '{"name":"element-web-app","version":"1.0.0","links":{"ui":"/"}}';
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /og.png {
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* ^/(favicon\.svg|favicon\.ico|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Atlas photos/structures and brand images: stable names, not hashed. Missing files 404 (no SPA fallback).
    location ~ ^/(media|brand)/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
