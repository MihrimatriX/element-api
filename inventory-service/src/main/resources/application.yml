server:
  port: 8080

spring:
  application:
    name: element-inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/element_inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:mysecretpassword}
  sql:
    init:
      mode: always
      # schema.sql is idempotent; a failed statement must crash startup (restart), not run without tables.
      continue-on-error: false
  lifecycle:
    # Graceful shutdown is the Boot 3.4 default; keep listener + web stop phases under Docker's 10s kill.
    timeout-per-shutdown-phase: 4s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Back off instead of instant infinite requeue; after 5 attempts park in inventory-service_failed.
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2

inventory:
  default-stock-grams: ${DEFAULT_STOCK_GRAMS:100000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
