http.enabled: true
http.host: 0.0.0.0
http.port: 5066

filebeat.autodiscover:
  providers:
    - type: docker
      host: "unix:///var/run/docker.sock"
      hints.enabled: false
      templates:
        - condition:
            regexp:
              docker.container.name: "^element-.*"
          config:
            - type: filestream
              id: "docker-${data.docker.container.id}"
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              parsers:
                - container:
                    stream: all
                    format: auto
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true
                    add_error_key: true
                    when.regexp:
                      message: '^\s*\{'
                - add_fields:
                    target: ""
                    fields:
                      service: "${data.docker.container.name}"

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
