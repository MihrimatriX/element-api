input {
  beats {
    port => 5044
  }

  http {
    id => "app_logs_http"
    port => 8080
    codec => json_lines
  }

  tcp {
    id => "app_logs_tcp"
    port => 50000
    codec => json_lines
  }
}

filter {
  if [agent][type] == "metricbeat" {
    mutate { add_field => { "[@metadata][target_index]" => "element-metrics" } }
  } else if [Application] or [service] or [logger_name] or [req] or [RequestMethod] {
    mutate { add_field => { "[@metadata][target_index]" => "element-app-logs" } }
  } else {
    mutate { add_field => { "[@metadata][target_index]" => "element-logs" } }
  }

  if [container][labels][com_docker_compose_service] and ![service] {
    mutate {
      add_field => { "service" => "%{[container][labels][com_docker_compose_service]}" }
    }
  }

  if [service] {
    mutate { add_field => { "service.name" => "%{[service]}" } }
  }

  # Serilog request log (.NET)
  if [RequestMethod] and [RequestPath] {
    mutate {
      add_field => {
        "http.method" => "%{[RequestMethod]}"
        "http.path" => "%{[RequestPath]}"
        "http.status_code" => "%{[StatusCode]}"
        "http.duration_ms" => "%{[Elapsed]}"
      }
    }
  }

  # pino-http (order-service)
  if [req][method] {
    mutate {
      add_field => {
        "http.method" => "%{[req][method]}"
        "http.path" => "%{[req][url]}"
      }
    }
  }
  if [res][statusCode] {
    mutate { add_field => { "http.status_code" => "%{[res][statusCode]}" } }
  }
  if [responseTime] {
    mutate { add_field => { "http.duration_ms" => "%{[responseTime]}" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}-%{+yyyy.MM.dd}"
  }
}
