{{- $root := . }}
{{- $fullname := include "element-market.fullname" . }}
{{- $pgHost := printf "%s-postgres" $fullname }}
{{- $rabbitHost := printf "%s-rabbitmq" $fullname }}
{{- range $name, $svc := .Values.services }}
{{- if ne $name "gateway" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $name }}
spec:
  ports:
    - port: {{ $svc.port }}
  selector:
    app: element-{{ $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-{{ $name }}
spec:
  selector:
    matchLabels:
      app: element-{{ $name }}
  template:
    metadata:
      labels:
        app: element-{{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:{{ $svc.port }}
            - name: RabbitMQ__Host
              value: {{ $rabbitHost | quote }}
            {{- if $svc.database }}
            - name: ConnectionStrings__DefaultConnection
              value: {{ include "element-market.postgresConnection" (dict "root" $root "database" $svc.database) | quote }}
            {{- end }}
            {{- if eq $name "identity" }}
            - name: RedisConnection
              value: {{ $root.Values.global.redis | quote }}
            - name: JwtSettings__Secret
              value: {{ $root.Values.secrets.jwtSecret | quote }}
            {{- end }}
            {{- if or (eq $name "element") (eq $name "order") }}
            - name: RedisConnection
              value: {{ $root.Values.global.redis | quote }}
            {{- end }}
            {{- if eq $name "order" }}
            - name: ElementServiceInternalUrl
              value: http://{{ $fullname }}-element:{{ $root.Values.services.element.port }}
            {{- end }}
            {{- if eq $name "notification" }}
            - name: Cors__Origins
              value: {{ $root.Values.notification.corsOrigins | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $svc.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}
{{- end }}
