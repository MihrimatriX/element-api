apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: element-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: element.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
      - path: /hub
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8080
