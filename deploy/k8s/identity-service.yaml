apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  ports:
    - port: 8080
  selector:
    app: identity-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: element-identity-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: RedisConnection
          value: "redis:6379"
        - name: JwtSettings__Secret
          valueFrom:
            secretKeyRef:
              name: element-secrets
              key: jwt-secret
              optional: true
        - name: ConnectionStrings__DefaultConnection
          value: "Host=element-postgres;Port=5432;Database=element_identity_db;Username=postgres;Password=mysecretpassword"
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
