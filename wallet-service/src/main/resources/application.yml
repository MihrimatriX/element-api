server:
  port: 8080

spring:
  application:
    name: element-wallet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/element_wallet_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:mysecretpassword}
  sql:
    init:
      mode: always
      # schema.sql is idempotent; a failed statement must abort startup (exit 1 -> Docker restart),
      # not leave the service running without tables.
      continue-on-error: false
  lifecycle:
    # Stay inside Docker's 10s stop grace (Rabbit listener stop is separately capped at 5s).
    timeout-per-shutdown-phase: 5s
  http:
    client:
      # MarketClient -> catalog/compound; a hung peer must not pin request threads forever.
      connect-timeout: 2s
      read-timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Back off instead of instant infinite requeue; after 5 attempts park in wallet-service_failed.
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2

wallet:
  credit-limit: ${CREDIT_LIMIT:50000}
  # Local demos keep 10000; public compose overrides to 1000.
  welcome-grant: ${WALLET_WELCOME_GRANT:10000}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:5002}
  compound-url: ${COMPOUND_SERVICE_URL:http://localhost:5007}
  market-spread-pct: ${MARKET_SPREAD_PCT:0.008}

internal:
  api-key: ${INTERNAL_API_KEY:element-internal-dev-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
