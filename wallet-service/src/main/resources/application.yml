server:
  port: 8080

spring:
  application:
    name: element-wallet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/element_wallet_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:mysecretpassword}
  sql:
    init:
      mode: always
      continue-on-error: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

wallet:
  credit-limit: ${CREDIT_LIMIT:50000}
  # Local demos keep 10000; public compose overrides to 1000.
  welcome-grant: ${WALLET_WELCOME_GRANT:10000}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:5002}
  compound-url: ${COMPOUND_SERVICE_URL:http://localhost:5007}
  market-spread-pct: ${MARKET_SPREAD_PCT:0.008}

internal:
  api-key: ${INTERNAL_API_KEY:element-internal-dev-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
