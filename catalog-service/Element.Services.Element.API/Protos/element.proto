syntax = "proto3";

option csharp_namespace = "Element.Services.Element.API.Grpc";

package element;

service ElementGrpc {
  rpc GetElementPrice (ElementPriceRequest) returns (ElementPriceResponse);
}

message ElementPriceRequest {
  string symbol = 1;
}

message ElementPriceResponse {
  string symbol = 1;
  double price_per_gram = 2;
  bool is_success = 3;
  string error_message = 4;
}
